schema = "bloom.petal.build.v1"
name = "polymarket"
routes = "route/files"
output = "petal/polymarket"

[route_crate]
package = "bloom-polymarket-route"
path = "route"
alias = "polymarket_route"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "ba13a90f7f10de955d868d01085f34134d8aed3e"

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "serde", "sol-types", "std"] }
alloy-dyn-abi = { version = "=1.6.0", features = ["eip712"] }
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
