schema = "bloom.petal.build.v1"
name = "polymarket"
routes = "route/files"
output = "petal/polymarket"

[route_crate]
package = "bloom-polymarket-route"
path = "route"
alias = "polymarket_route"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "eda6647c523bba161eaa22812aa0e75ec7782404"

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "sol-types", "std"] }
hex = "0.4"
serde_json = "1"
serde_jcs = "0.2"
