[package]
name = "bloom-polymarket-route"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = []
native-client = []

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "sol-types", "std", "serde"] }
base64 = "0.22"
blake3 = "1"
alloy-dyn-abi = { version = "1.6", features = ["eip712"] }
hex = "0.4"
hmac = "0.12"
petal = { package = "bloom-petal-sdk", git = "https://github.com/bloom-directory/petal", rev = "750df682bebd1dd85c48bd22d8741f22ef7a6185", features = ["evm"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
url = "2"

[dev-dependencies]
alloy = { version = "2", default-features = false, features = ["signer-local"] }
bloom-petal-contract = { git = "https://github.com/bloom-directory/petal", rev = "750df682bebd1dd85c48bd22d8741f22ef7a6185" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
