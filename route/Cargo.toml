[package]
name = "bloom-polymarket-route"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = []
native-client = []

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "sol-types", "std"] }
base64 = "0.22"
blake3 = "1"
hex = "0.4"
hmac = "0.12"
petal = { package = "bloom-petal-sdk", git = "https://github.com/bloom-directory/petal", rev = "eda6647c523bba161eaa22812aa0e75ec7782404" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
url = "2"

[dev-dependencies]
alloy = { version = "2", default-features = false, features = ["signer-local"] }
bloom-petal-contract = { git = "https://github.com/bloom-directory/petal", rev = "eda6647c523bba161eaa22812aa0e75ec7782404" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
