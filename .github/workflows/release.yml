name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Keep this reference pinned to the full commit SHA that defines the
    # packaging and release contract; do not replace it with a branch or tag.
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@2beed2ff344ce2b0c112e07096027e1ae0404007
    with:
      petal-name: polymarket
      # This independently pins the canonical CLI used to build and package the
      # release to the same reviewed tooling commit as `uses:`.
      petal-tooling-ref: "2beed2ff344ce2b0c112e07096027e1ae0404007"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 99
    secrets:
      compile-time-secret: ${{ secrets.POLYMARKET_BUILDER_CODE }}
