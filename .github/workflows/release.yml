name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Keep this reference pinned to the full commit SHA that defines the
    # packaging and release contract; do not replace it with a branch or tag.
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@1612f6fd14d3b8a5c52c28b6e6f69051b09ba852
    with:
      petal-name: polymarket
      # This independently pins the canonical CLI used to build and package the
      # release to the same reviewed tooling commit as `uses:`.
      petal-tooling-ref: "1612f6fd14d3b8a5c52c28b6e6f69051b09ba852"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 95
