name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain and WASM target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format route crate
        run: cargo fmt --manifest-path route/Cargo.toml -- --check
      - name: Test route crate
        run: cargo test --manifest-path route/Cargo.toml --locked
      - name: Clippy route crate
        run: cargo clippy --manifest-path route/Cargo.toml --locked -- -D warnings
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.249.0 --locked
      - name: Build source package
        run: scripts/build.sh
      - name: Checkout Bloom CLI
        uses: actions/checkout@v6
        with:
          repository: bloom-directory/bloom
          ref: feat/local-petal-plugins
          path: bloom
      - name: Validate package with Bloom
        run: cargo run --manifest-path bloom/Cargo.toml -p bloom -- petal app build "$GITHUB_WORKSPACE"
      - name: Smoke install and dispatch
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          cargo run --manifest-path bloom/Cargo.toml -p bloom -- --home "$home" petal install "$GITHUB_WORKSPACE"
          cargo run --manifest-path bloom/Cargo.toml -p bloom -- --home "$home" vfs cat /apps/polymarket/meta/parity.json | grep -q 'polymarket_v2_petal_parity'
