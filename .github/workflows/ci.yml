name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain and WASM target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            route
      - name: Format route crate
        run: cargo fmt --manifest-path route/Cargo.toml -- --check
      - name: Test route crate
        run: cargo test --manifest-path route/Cargo.toml --locked
      - name: Clippy route crate
        run: cargo clippy --manifest-path route/Cargo.toml --locked --all-targets -- -D warnings
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.249.0 --locked
      - name: Install canonical Petal toolchain
        run: cargo install --git https://github.com/bloom-directory/petal --rev 864a80b407387871bae06aabe77b91865e55f7bc --locked bloom-petal-cli
      - name: Build source package
        run: scripts/build.sh
      - name: Checkout Bloom CLI
        uses: actions/checkout@v6
        with:
          repository: bloom-directory/bloom
          ref: master
          path: bloom
          persist-credentials: false
      - name: Build key-free debug Bloom CLI for install smoke tests
        run: |
          cargo build --manifest-path bloom/Cargo.toml -p bloom --bin bloom
          cp bloom/target/debug/bloom "$RUNNER_TEMP/bloom"
          rm -rf bloom
      - name: Smoke install and dispatch
        shell: bash
        run: |
          set -euo pipefail
          smoke_home="$(mktemp -d)"
          cat > "$smoke_home/config.toml" <<'EOF'
          default_chain = "local"
          [chains.local]
          name = "local"
          chain_id = 31337
          rpc_urls = ["http://127.0.0.1:1"]
          allow_broadcast = false
          display_name = "Local smoke"
          native_symbol = "ETH"
          native_decimals = 18
          legacy_tx = false
          [petals]
          preinstalled = []
          EOF
          export BLOOM_MACHINE_IDENTITY="$smoke_home/absent-identity.json"
          export BLOOM_EDGE_MANIFEST="$smoke_home/absent-edge.json"
          export BLOOM_BROKER_SOCKET="$smoke_home/absent-broker.sock"
          "$RUNNER_TEMP/bloom" --home "$smoke_home" serve > "$smoke_home/daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true; rm -rf "$smoke_home"' EXIT
          for attempt in {1..60}; do
            if "$RUNNER_TEMP/bloom" --home "$smoke_home" status >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$daemon_pid" 2>/dev/null || [[ "$attempt" == 60 ]]; then
              cat "$smoke_home/daemon.log" >&2
              exit 1
            fi
            sleep 1
          done
          "$RUNNER_TEMP/bloom" --home "$smoke_home" petal install "$GITHUB_WORKSPACE"
          contract="$RUNNER_TEMP/route-contract.json"
          "$RUNNER_TEMP/bloom" --home "$smoke_home" vfs cat /petals/polymarket/meta/route-contract.json > "$contract"
          for required in \
            'bloom.polymarket.petal-route-contract.v1' \
            'settings/enso-api-key' \
            'fund/<wallet>/<id>/confirm' \
            'trade/<wallet>/orders/<clob-order-id>/cancel' \
            'redeem/<wallet>/<slug>/confirm' \
            'revoke-approvals/<wallet>/request/confirm' \
            'withdraw/<wallet>/pusd/confirm' \
            'obligations/<wallet>.json' \
            'bloom:sign/signing@0.2.0' \
            'bloom:tx/outbox@0.1.0' \
            'bloom:chain/read@0.1.0'; do
            grep -Fq "$required" "$contract"
          done
          ! rg -n 'vfs_(read|write).*polymarket/' route/src
      - name: Validate GitHub source install
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://github.com/${GITHUB_REPOSITORY}"
          source_ref="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_url="$(jq -r '.pull_request.head.repo.html_url' "$GITHUB_EVENT_PATH")"
            source_ref="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          fi
          smoke_home="$(mktemp -d)"
          cat > "$smoke_home/config.toml" <<'EOF'
          default_chain = "local"
          [chains.local]
          name = "local"
          chain_id = 31337
          rpc_urls = ["http://127.0.0.1:1"]
          allow_broadcast = false
          display_name = "Local smoke"
          native_symbol = "ETH"
          native_decimals = 18
          legacy_tx = false
          [petals]
          preinstalled = []
          EOF
          export BLOOM_MACHINE_IDENTITY="$smoke_home/absent-identity.json"
          export BLOOM_EDGE_MANIFEST="$smoke_home/absent-edge.json"
          export BLOOM_BROKER_SOCKET="$smoke_home/absent-broker.sock"
          "$RUNNER_TEMP/bloom" --home "$smoke_home" serve > "$smoke_home/daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true; rm -rf "$smoke_home"' EXIT
          for attempt in {1..60}; do
            if "$RUNNER_TEMP/bloom" --home "$smoke_home" status >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$daemon_pid" 2>/dev/null || [[ "$attempt" == 60 ]]; then
              cat "$smoke_home/daemon.log" >&2
              exit 1
            fi
            sleep 1
          done
          "$RUNNER_TEMP/bloom" --home "$smoke_home" petal install "$source_url" --ref "$source_ref"
          "$RUNNER_TEMP/bloom" --home "$smoke_home" vfs cat /petals/polymarket/meta/route-contract.json | grep -Fq 'settings/enso-api-key'
