[package]
name = "bloom-polymarket"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Polymarket v2 client (Gamma/Data/CLOB reads + L1/L2 auth signing) for bloom"

[features]
default = ["native-client"]
native-client = ["dep:reqwest", "dep:tokio"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tracing = "0.1"
url = "2"
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "signer-local", "sol-types", "std"] }
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
