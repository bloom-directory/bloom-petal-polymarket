schema = "bloom.petal.package.v1"
name = "polymarket"

[source]
kind = "github"
repository = "bloom-directory/bloom-petal-polymarket"

[build]
command = "scripts/build.sh"
outputs = ["petal/polymarket"]

[consent]
summary = "Expose Polymarket market reads, onboarding, account views, funding drafts, and trade draft/post/cancel flows as a Petal."

[caps]
allowed = ["bloom:http", "bloom:store", "bloom:sign", "bloom:tx.outbox", "bloom:chain", "bloom:vfs.read", "bloom:vfs.write"]

[[net.allow]]
binding = "gamma"
host = "gamma-api.polymarket.com"
methods = ["get"]
paths = ["/markets", "/markets/slug/*", "/public-search"]

[[net.allow]]
binding = "data"
host = "data-api.polymarket.com"
methods = ["get"]
paths = ["/positions", "/trades", "/activity"]

[[net.allow]]
binding = "clob"
host = "clob.polymarket.com"
methods = ["get"]
paths = [
  "/auth/derive-api-key",
  "/auth/builder-api-key",
  "/balance-allowance",
  "/balance-allowance/update",
  "/book",
  "/data/orders",
  "/midpoint",
  "/orders",
  "/price",
  "/spread",
  "/time",
]

[[net.allow]]
binding = "clob"
host = "clob.polymarket.com"
methods = ["post"]
paths = [
  "/auth/api-key",
  "/auth/builder-api-key",
  "/balance-allowance/update",
  "/order",
]

[[net.allow]]
binding = "clob"
host = "clob.polymarket.com"
methods = ["delete"]
paths = ["/order", "/auth/builder-api-key"]

[[net.allow]]
host = "api.enso.finance"
methods = ["get"]
paths = ["/api/v1/shortcuts/quote", "/api/v1/shortcuts/route"]

[[net.allow]]
binding = "relayer"
host = "relayer-v2.polymarket.com"
methods = ["get", "post"]
paths = ["/nonce", "/submit", "/transaction"]

[sign]
allowed_intents = [
  "polymarket.onboard",
  "polymarket.order.poly1271",
  "polymarket.relayer_batch",
]

[store]
namespaces = ["state"]
secret_namespaces = ["secrets"]
